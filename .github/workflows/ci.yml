name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    name: Compile, unit tests, Javadoc (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        java: [17, 21]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Compile
        run: mvn -B --no-transfer-progress -DskipTests compile

      # Live integration/e2e suites stay skipped: BLNK_E2E is unset.
      - name: Run unit tests
        run: mvn -B --no-transfer-progress test

      # The release profile turns doclint off, so broken HTML or dead {@link}s
      # would ship unnoticed. Check everything except missing @param/@return.
      - name: Check Javadoc
        run: >-
          mvn -B --no-transfer-progress -DskipTests -Ddoclint=all,-missing
          org.apache.maven.plugins:maven-javadoc-plugin:3.11.2:javadoc

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-jdk${{ matrix.java }}
          path: target/surefire-reports/
