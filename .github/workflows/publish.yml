name: Publish to Maven Central

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    name: Publish com.blnkfinance:blnk-java
    runs-on: ubuntu-latest
    environment: maven-central
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Imports the signing key and writes the "central" server entry that the
      # release profile's central-publishing plugin reads from ~/.m2/settings.xml.
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD

      - name: Verify tag matches pom version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          POM_VERSION=$(mvn -q --no-transfer-progress help:evaluate -Dexpression=project.version -DforceStdout)
          if [ "$TAG_VERSION" != "$POM_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pom.xml version $POM_VERSION"
            exit 1
          fi

      - name: Run unit tests
        run: mvn -B --no-transfer-progress test

      # Builds jar, sources, and Javadoc, signs them, and stages to the Central
      # Portal. autoPublish is false in the pom, so the bundle waits for a manual
      # "Publish" click after validation, matching the existing release flow.
      - name: Build, sign, and stage to Central Portal
        run: mvn -B --no-transfer-progress -Prelease -DskipTests -Dgpg.signer=bc deploy
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

      - name: Smoke test built jar
        run: |
          JAR=$(ls target/blnk-java-*.jar | grep -v -e sources -e javadoc)
          jar tf "$JAR" | grep -q 'com/blnkfinance/blnk/Blnk.class'
          echo "OK: $JAR contains com.blnkfinance.blnk.Blnk"
